<title>Home Buying Decision Room</title>
<meta name="description" content="A research and decision room for first-time homebuyers in Delhi NCR. All property data is simulated.">
<style>
/* Tokens from docs/DESIGN_SYSTEM_PLAN.md (derived from design.md "Zero Interface") */
:root {
  --surface: #FAFAFA; --surface-muted: #F0F0F0; --surface-warm: #F5F1E8;
  --ink: #1F2328; --ink-muted: #5F6368; --border: #E4E4E4; --danger: #B3261E;
  --cta: #252C49; --cta-hover: #1C2239; /* user-supplied dark reference: primary CTAs (13:1 on #FAFAFA) */

  --cta-text: var(--cta); --chart-ink: #252C49;
  --page: #FFFFFF; --card: #FFFFFF; /* white everywhere: colour lives on UI elements only */
  --s-verified: #2E7D5B; --s-sourced: #4A6A8A; --s-conflicting: #B26A00; --s-estimated: #2E7A7A;
  --s-assumption: #7A6A55; --s-unknown: #6B6B6B; --s-not_assessed: #6B6B6B;
  --r: 8px; --shadow: 0 2px 8px rgba(0,0,0,0.06); --shadow-lift: 0 2px 8px rgba(0,0,0,0.08);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2,.7,.2,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #FFFFFF; color: var(--ink); font: 400 1rem/1.6 var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.sm { width: 14px; height: 14px; } svg.i.lg { width: 22px; height: 22px; }
.mono { font-family: var(--mono); font-size: .8125rem; letter-spacing: -.01em; }
.muted { color: var(--ink-muted); }
.small { font-size: .875rem; } .xs { font-size: .75rem; }
.caps { font-size: .75rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
.warn { color: var(--s-conflicting); }

/* ---------- Stage: device frame + judge annotation rail ---------- */
.stage { min-height: 100dvh; max-width: 1280px; margin: 0 auto; padding: 1.5rem; display: grid; grid-template-columns: 412px minmax(0, 1fr); gap: 3rem; align-items: start; }
.device { position: sticky; top: 1.5rem; width: 412px; height: min(880px, calc(100dvh - 3rem)); background: var(--card); border: 10px solid var(--ink); border-radius: 36px; overflow: hidden; box-shadow: var(--shadow-lift); }
.phone { position: relative; height: 100%; display: flex; flex-direction: column; background: var(--page); }
.rail { padding: 2rem 0; max-width: 560px; }
.rail h1 { font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 700; letter-spacing: -.03em; line-height: 1.05; }
.rail .lede { margin-top: 1rem; color: var(--ink-muted); max-width: 72ch; }
.note { margin-top: 2rem; padding: 1.25rem 1.5rem; background: var(--card); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); }
.note h3 { font-size: 1.125rem; margin: .25rem 0 .5rem; }
.note ul { padding-left: 1.1rem; } .note li { margin: .25rem 0; color: var(--ink-muted); font-size: .9375rem; }
.rail .row { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: 1rem; }

@media (max-width: 767px) {

  /* wider than a phone but narrower than desktop: keep phone proportions, centred */
  @media (min-width: 480px) { .device { border-left: 1px solid var(--border); border-right: 1px solid var(--border); } }
  .rail { display: none; }
}

/* ---------- App chrome ---------- */
.top { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: .5rem; padding: .875rem 1.25rem .625rem; background: var(--page); }
.top .title { font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.demo-tag { font-size: .6875rem; font-weight: 500; letter-spacing: .04em; padding: 2px 6px; border: 1px dashed var(--ink-muted); border-radius: 4px; color: var(--ink-muted); white-space: nowrap; }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 1.25rem 6rem; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.nav { position: absolute; z-index: 100; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--card); border-top: 1px solid var(--border); padding: .375rem 0 .625rem; }
.nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .75rem; color: var(--ink-muted); text-decoration: none; position: relative; padding-top: .375rem; }

.nav a.on::before { content: ""; position: absolute; top: -7px; width: 24px; height: 2px; background: var(--cta); border-radius: 2px; }
.nav .badge { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--ink); color: var(--surface); font-size: .625rem; display: grid; place-items: center; }

/* ---------- Type & sections ---------- */
h1.h { font-size: 2.25rem; font-weight: 700; letter-spacing: -.025em; line-height: 1.1; }
h2.h { font-size: 1.5rem; font-weight: 700; letter-spacing: -.015em; line-height: 1.2; }

.sec { margin-top: 2rem; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: .75rem; gap: .5rem; }
.sec-h .caps { flex: 1; }
.link { font-size: .875rem; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--border); }

/* ---------- Buttons, chips, inputs ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: 12px 16px; white-space: nowrap; border-radius: var(--r); font-weight: 600; font-size: .9375rem; transition: transform .2s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease), filter .2s var(--ease); }
.btn.primary { background: var(--cta); color: var(--surface); }
.btn.primary:hover { background: var(--cta-hover); box-shadow: var(--shadow-lift); }
.btn.primary:active, .btn.ghost:active { transform: translateY(1px); }
.btn.ghost { border: 1.5px solid var(--border); color: var(--ink); }

.chip { display: inline-flex; align-items: center; gap: .375rem; padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--r); font-size: .875rem; font-weight: 500; background: var(--card); transition: background .2s var(--ease); white-space: nowrap; }
.chip.on { background: var(--cta); color: var(--surface); border-color: var(--cta); }
.chip.assumed { border-style: dashed; color: var(--s-assumption); }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; }
.hscroll { display: flex; gap: .5rem; overflow-x: auto; scrollbar-width: none; margin: 0 -1.25rem; padding: 0 1.25rem; }
.hscroll::-webkit-scrollbar { display: none; }
label.lbl { display: block; font-size: .875rem; font-weight: 500; margin-bottom: .375rem; }
.input { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--r); background: var(--card); outline: none; }
.input:focus-visible, .btn:focus-visible, .chip:focus-visible, .iconbtn:focus-visible, a:focus-visible, .card:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
textarea.input { resize: none; min-height: 116px; line-height: 1.5; }
.field { margin-top: 1.25rem; }

/* ---------- Cards ---------- */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); padding: 1rem; transition: box-shadow .2s var(--ease), transform .2s var(--ease); }

.card.tap:hover { box-shadow: var(--shadow-lift); }
.card + .card { margin-top: .75rem; }
.rs-card.warm { background: #FBF8F1; border-color: #EDE5D3; box-shadow: none; } /* property page research summary: very light warm, from surface-warm */
.rs-card .cite { background: var(--card); }
.warm { background: var(--card); border-color: #E2D7BF; box-shadow: inset 3px 0 0 #D9CDB3, var(--shadow); } /* AI/insight card: white surface, warm accent edge */
.pcard { padding: 0; overflow: hidden; touch-action: pan-y; user-select: none; position: relative; z-index: 1; }
.pcard .body { padding: 1rem 1rem 1.125rem; display: grid; gap: .75rem; }
.pcard .art { height: 140px; border-bottom: 1px solid var(--border); }
.pcard .meta { display: flex; justify-content: space-between; gap: .75rem; align-items: flex-start; }
.pcard .cfg { margin-top: -.5rem; }
.pcard .research { display: flex; justify-content: space-between; align-items: center; gap: .5rem; padding-top: .75rem; border-top: 1px solid var(--border); }
.pcard .reasons { margin-top: 0; }
.issue { display: flex; align-items: center; gap: .5rem; padding: .5rem .625rem; border-radius: 6px; background: var(--surface-warm); font-size: .8125rem; color: var(--ink); }

.home-list > * + * { margin-top: 1.25rem; }
.recent { display: flex; gap: .75rem; align-items: flex-start; padding: .75rem 0; border-bottom: 1px solid var(--border); cursor: pointer; }
.recent:last-child { border-bottom: 0; }
.insight-ai { display: flex; gap: .75rem; align-items: flex-start; }
.ai-strip { display: flex; align-items: center; gap: .625rem; padding: .625rem .625rem .625rem .75rem; border-radius: var(--r); background: var(--surface-warm); border: 1px solid #E9E2D2; }
.ai-strip p { flex: 1; min-width: 0; font-size: .875rem; line-height: 1.45; }

.ai-tag .i { width: 11px; height: 11px; }
.ai-more { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 1px solid #E9E2D2; color: var(--cta-text); flex: none; }
/* Notifications: grouped, tinted, read/unread distinct */
/* Notifications screen keeps a white page; accents stay on items only */
.ngroup { margin-top: 1.5rem; border-radius: var(--r); overflow: hidden; border: 1px solid var(--border); background: var(--card); box-shadow: var(--shadow); }
.ngroup .notif .small { margin-top: 2px; line-height: 1.45; }
.ngroup .notif .xs { margin-top: 4px; }
.ngroup .notif .nacts { margin-top: .625rem; }
.ngroup.new { border-color: var(--tint-200); }
.ngroup-h { display: flex; justify-content: space-between; align-items: center; padding: .5rem .875rem; font-size: .75rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); background: var(--surface-muted); }
.ngroup.new .ngroup-h { background: var(--tint-100); color: var(--cta-text); }
.ngroup .notif { padding: 1.25rem 1rem; position: relative; gap: .875rem; }
.notif.un { background: transparent; }
.notif.un.high::before { content: ""; position: absolute; left: 0; top: 1.25rem; bottom: 1.25rem; width: 3px; border-radius: 0 3px 3px 0; background: var(--s-conflicting); }
.notif.quiet .nic { background: var(--surface-muted); color: var(--ink-muted); }
.nic.reminder { background: var(--tint-100); color: var(--cta-text); }
.notif .kindl { font-size: .6875rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.kindl.k-finding { color: var(--s-conflicting); } .kindl.k-update { color: var(--cta-text); } .kindl.k-reminder { color: var(--cta-text); } .kindl.k-activity { color: var(--ink-muted); }
.insight-ai .mark { width: 32px; height: 32px; border-radius: var(--r); background: var(--surface); border: 1px solid #E9E2D2; display: grid; place-items: center; flex: none; color: var(--cta-text); }
/* Notifications */
.notif { display: flex; gap: .75rem; align-items: flex-start; padding: .875rem 0; border-bottom: 1px solid var(--border); }
.notif:last-child { border-bottom: 0; }
.notif.un .small { font-weight: 600; color: var(--ink); }
.notif:not(.un) .small { color: var(--ink-muted); }
.nic { width: 32px; height: 32px; border-radius: var(--r); display: grid; place-items: center; flex: none; background: var(--surface-muted); color: var(--ink-muted); position: relative; }
.notif.un .nic::after { content: ""; position: absolute; top: -2px; right: -2px; width: 8px; height: 8px; border-radius: 50%; background: var(--cta); border: 2px solid var(--surface); }
.nic.conflict, .nic.missing { background: var(--surface-warm); color: var(--s-conflicting); }
.nic.infra { background: var(--surface-warm); color: var(--cta-text); }
.nacts { display: flex; gap: 1rem; margin-top: .375rem; font-size: .8125rem; }
/* Insights */
.kf { color: var(--cta-text); font-weight: 600; }
.finding { margin-top: .75rem; font-size: .9375rem; color: var(--ink); padding: .125rem 0 .125rem .875rem; background: transparent; border-left: 3px solid var(--cta); }
.ins-h { display: flex; gap: .75rem; align-items: center; }
.ins-h .mark { width: 36px; height: 36px; border-radius: var(--r); background: var(--tint-100); border: 1px solid var(--tint-200); display: grid; place-items: center; color: var(--cta-text); flex: none; }
section.ins { margin-top: 2.5rem; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: .5rem; }
.stat { padding: .75rem; border: 1px solid var(--border); border-radius: var(--r); background: var(--card); display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--mono); font-size: 1.25rem; line-height: 1.2; color: var(--ink); font-variant-numeric: tabular-nums; }
.stat b.kf { color: var(--cta-text); } .stat b.warn { color: var(--s-conflicting); }
.stat span { font-size: .6875rem; line-height: 1.3; color: var(--ink-muted); }
.chart { display: block; width: 100%; height: auto; margin: .625rem 0 .25rem; }
.stack-row { display: grid; grid-template-columns: 112px 1fr 38px; gap: .625rem; align-items: center; padding: .3125rem 0; font-size: .8125rem; cursor: pointer; }
.stack-row .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stack { display: flex; gap: 2px; height: 10px; border-radius: 3px; overflow: hidden; }
.stack i { display: block; height: 100%; }
.stack-row .pc { text-align: right; font-size: .75rem; color: var(--ink-muted); }
.inv { scroll-margin-top: 12px; position: relative; }
.inv + .inv { margin-top: 1rem; }
.flash::after { content: ""; position: absolute; inset: -1px; border-radius: var(--r); border: 2px solid var(--cta); opacity: 0; animation: flash 2.4s var(--ease); pointer-events: none; }
.card.flash { position: relative; }
@keyframes flash { 10%, 60% { opacity: 1; } 100% { opacity: 0; } }
.tl { display: flex; flex-wrap: wrap; gap: .25rem .875rem; margin-top: .625rem; font-size: .75rem; color: var(--ink-muted); }

.steps-list li::before { counter-increment: st; content: counter(st); grid-row: span 2; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--cta); color: var(--surface); font-family: var(--mono); font-size: .75rem; }
.steps-list li .link { justify-self: start; }
/* Similar properties (compact horizontal cards) */
.similar { display: flex; gap: .75rem; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -1.25rem; padding: .25rem 1.25rem .75rem; scrollbar-width: none; }
.similar::-webkit-scrollbar { display: none; }
.mini { flex: 0 0 172px; scroll-snap-align: start; padding: 0; overflow: hidden; }

.mini .why { font-size: .6875rem; color: var(--ink-muted); }
/* Details / Map switch + schematic map */
.seg { display: grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: var(--r); background: var(--tint-100); margin-top: 1rem; }
.seg button { padding: 8px; border-radius: 6px; font-size: .875rem; font-weight: 500; color: var(--ink-muted); display: inline-flex; justify-content: center; align-items: center; gap: .375rem; transition: background .2s var(--ease); }
.seg button.on { background: var(--card); color: var(--cta-text); box-shadow: var(--shadow); font-weight: 600; }

.legend-row i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
.near { display: flex; align-items: center; gap: .75rem; padding: .625rem .5rem; margin: 0 -.5rem; border-radius: 6px; cursor: pointer; font-size: .9375rem; }
.near.sel { background: var(--surface-warm); }
.near .d { margin-left: auto; font-family: var(--mono); font-size: .8125rem; }
.near .dot2 { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.price { font-family: var(--mono); font-size: 1rem; font-weight: 600; white-space: nowrap; }
.reasons { margin-top: .75rem; display: grid; gap: .375rem; font-size: .875rem; }

.reasons .i { margin-top: 3px; }
.pcard .foot { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .75rem 1rem; border-top: 1px solid var(--border); }
.swipe-wrap { position: relative; border-radius: var(--r); }
.card + .card { margin-top: 1rem; }
.swipe-bg { position: absolute; inset: 0; border-radius: var(--r); display: flex; align-items: center; justify-content: space-between; padding: 0 1.25rem; font-size: .875rem; font-weight: 600; color: var(--cta-text); background: var(--tint-100); }

/* ---------- Status, fit, evidence ---------- */
.st { display: inline-flex; align-items: center; gap: .25rem; font-size: .75rem; font-weight: 500; white-space: nowrap; }
.st.verified { color: var(--s-verified); } .st.sourced { color: var(--s-sourced); } .st.conflicting { color: var(--s-conflicting); }
.st.estimated { color: var(--s-estimated); } .st.assumption { color: var(--s-assumption); } .st.unknown, .st.not_assessed { color: var(--s-unknown); }

.act { display: inline-flex; align-items: center; gap: .375rem; padding: 6px 10px; border-radius: var(--r); font-size: .8125rem; font-weight: 600; background: var(--cta); color: var(--surface); }

.act.shortlist { background: var(--card); color: var(--ink); border: 1.5px solid var(--border); }
.act.walk { background: var(--card); color: var(--ink-muted); border: 1.5px dashed var(--border); }

/* ---------- Home ---------- */
.profile-strip { display: flex; align-items: center; gap: .75rem; padding: .75rem 1rem; border-radius: var(--r); background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow); font-size: .875rem; }
.profile-strip > .i { color: var(--cta-text); }

<script>
/* Deterministic decision engine + grounded templated "AI" narration.

(function () {
  var E = DR.engine = {};

  };

  E.investCriteria = function (p, prof) {

    var pc = E.claim(p, 'possession'), oc = E.claim(p, 'oc'), pr = p.inv && p.inv.progress, dv = null, dd = '';
    if (p.stage === 'Ready to move') {

      else if (oc && oc.status === 'unknown') { dv = 0.4; dd = 'Ready · OC not found'; }
      else { dv = 0.7; dd = 'Ready · OC not checked'; }
    } else if (!pc || pc.status === 'unknown') { dv = null; dd = 'Possession date unknown'; }
    else if (pc.status === 'conflicting') { dv = 0.25; dd = 'Possession date disputed' + (pr ? ' · ' + pr.pct + '% built' : ''); }
    else { dv = pr ? 0.35 + 0.6 * pr.pct / 100 : 0.4; dd = p.possession + (pr ? ' · ' + pr.pct + '% built (' + pr.asOf + ')' : ' · progress unknown'); }

  };

  /* Investment-specific risks (plain language, sourced from the data, never predictions) */
  E.investRisks = function (p, prof) {
    var r = [], rt = E.rent(p), pr = p.inv && p.inv.progress, pc = E.claim(p, 'possession');
    E.findings(p).filter(function (f) { return f.severity !== 'low'; }).forEach(function (f) { r.push({ sev: f.severity, t: f.title, d: f.text }); });
    if (!rt) r.push({ sev: 'medium', t: 'Rental income unknown', d: 'No comparable rental listings were found, so rent and yield can\'t be estimated.' });
    else if (rt.n < 5) r.push({ sev: 'low', t: 'Thin rental evidence', d: 'Rent is based on only ' + rt.n + ' comparable listings.' });
    if (p.stage === 'Under construction') {
      if (!pr) r.push({ sev: 'medium', t: 'Construction progress unknown', d: 'No progress report found. Ask for the latest registry quarterly update.' });
      r.push({ sev: 'low', t: 'No rent until possession', d: 'Expected possession ' + p.possession + '. Payments continue while the home earns nothing.' });
      if (prof && prof.horizon && prof.horizon <= 3) r.push({ sev: 'medium', t: 'Short horizon for an under-construction home', d: 'Construction takes up a large part of your ' + prof.horizon + '-year horizon.' });
    }
    if (p.inv && p.inv.demand != null && p.inv.demand < 25) r.push({ sev: 'low', t: 'Low rental supply nearby', d: 'Only ' + p.inv.demand + ' active rental listings within 2 km. Demand is hard to judge.' });
    return r;
  };

  /* ---- Criterion scores: null = unknown (never scored as 0) ---- */
  E.criteria = function (p, prof) {
    if (prof.intent === 'invest') return E.investCriteria(p, prof);
    var out = {};
    var cm = prof.commuteMax || 45;
    var per = prof.places.map(function (pl) {
      var m = p.commute[pl.key];
      return { label: pl.label, min: m, ok: m <= cm, s: clamp(1 - (m - 15) / (cm + 15 - 15) * 0.75, 0, 1) };
    });
    var worst = Math.min.apply(null, per.map(function (x) { return x.s; }));
    var avg = per.reduce(function (a, x) { return a + x.s; }, 0) / per.length;
    out.commute = { s: per.some(function (x) { return !x.ok; }) ? Math.min(0.35, avg) : avg * 0.6 + worst * 0.4, detail: per.map(function (x) { return x.label.split(' · ')[0] + ' ' + x.min + ' min'; }).join(' · '), status: 'estimated' };
    if (!p.schools.length) out.schools = { s: null, detail: 'No school data', status: 'unknown' };
    else {
      var km = Math.min.apply(null, p.schools.map(function (s) { return s.km; }));
      out.schools = { s: km <= 1 ? 1 : km <= 2 ? 0.75 : km <= 4 ? 0.4 : 0.1, detail: p.schools.length + ' within ' + Math.max.apply(null, p.schools.map(function (s) { return s.km; })) + ' km · nearest ' + km + ' km', status: 'sourced' };
    }

    var ps = null, pd = '';

    else if (p.stage === 'Ready to move') {
      if (oc && oc.status === 'verified') { ps = 1; pd = 'Ready · OC on file'; }
      else if (oc && oc.status === 'unknown') { ps = 0.45; pd = 'Ready · OC not found'; }
      else { ps = 0.7; pd = 'Ready · OC not checked'; }
    } else { ps = pc.status === 'verified' ? 0.7 : 0.5; pd = p.possession + (pc.status === 'verified' ? ' · consistent across sources' : ' · single source'); }
    out.possession = { s: ps, detail: pd, status: pc ? pc.status : 'unknown' };
    var head = (prof.budgetMax - p.price) / prof.budgetMax;
    out.budget = { s: p.price > prof.budgetMax ? 0 : clamp(0.35 + head / 0.15 * 0.65, 0, 1), detail: p.price > prof.budgetMax ? 'Over budget' : '₹' + fmt(prof.budgetMax - p.price) + ' L headroom', status: E.claim(p, 'price').status };

    out.connectivity = { s: p.transit ? clamp(1 - p.transit.km / 2.5, 0.1, 1) : null, detail: p.transit ? p.transit.n + ' · ' + p.transit.km + ' km' : 'Unknown', status: 'sourced' };

  };

  E.weights = function (prof) {
    if (prof.intent === 'invest') {
      return { rental: { yield: 0.4, demand: 0.25, delivery: 0.2, growth: 0.15 }, appreciation: { growth: 0.4, delivery: 0.3, yield: 0.15, demand: 0.15 }, both: { yield: 0.3, growth: 0.3, delivery: 0.2, demand: 0.2 } }[prof.goal || 'both'];
    }

    var rest = keys.filter(function (k) { return prof.priorities.indexOf(k) < 0; });
    prof.priorities.forEach(function (k, i) { w[k] = top[i] || 0.1; });
    var used = prof.priorities.reduce(function (a, k, i) { return a + (top[i] || 0.1); }, 0);

  };

  E.evidence = function (p) {
    var crit = p.claims.filter(function (c) { return c.critical; });
    var v = crit.reduce(function (a, c) { return a + STATUS_WEIGHT[c.status]; }, 0) / crit.length;

    if (stale) v -= 0.2;

        title: c.label + ' mismatch', text: c.sources.map(function (s) { return DR.SOURCE_TYPES[s.type].name.replace(' (PDF)', '') + ': ' + s.value; }).join(' vs ') });

    });

    if (p.duplicate) f.push({ id: p.id + '-dup', pid: p.id, type: 'duplicate', severity: 'low', title: 'Duplicate listings merged', text: 'Two portal listings describe the same unit and were combined into one property.' });

      'p3-price': 'At ₹84.5 L your headroom drops from ₹7 L to ₹0.5 L, before ~7% stamp duty and registration (an assumption, see the cost breakdown).',
      'p4-oc': 'Without an occupancy certificate, banks may delay loan disbursal, utility connections can stay temporary, and resale becomes harder. For a ready-to-move home this is a key check.',
      'p7-possession': 'A 6-month slip means about 6 more months of rent alongside EMIs. The brochure is out of date, so ask which date goes into the agreement.',

    if (fd.type === 'loading') return 'Per-sq-ft prices quoted on SBA can make this home look cheaper than it is.';

      if (prof.localities && prof.localities.length) out.push({ label: 'Search all localities', gain: E.run(Object.assign({}, prof, { localities: [] })).pass.length - base, patch: { localities: [] } });
      if (prof.types.length < 2) out.push({ label: 'Include villas too', gain: E.run(Object.assign({}, prof, { types: ['Apartment', 'Villa'] })).pass.length - base, patch: { types: ['Apartment', 'Villa'] } });

  };

  /* All-in cost estimate (each line labelled) */
  E.costs = function (p) {
    var uc = p.stage === 'Under construction';
    var lines = [{ l: 'Quoted price', v: p.price, st: E.claim(p, 'price').status }];

  /* ---- NL requirement parser (rule-based, transparent) ---- */

      }).join('') + '</ul><p class="muted">Rents come from simulated comparable listings. These are estimates, not guaranteed income, and I don\'t forecast price appreciation.</p>', cites: cites };
    }
    if (/cost|price|afford|all.?in|budget/.test(t)) {
      return { html: '<p>Estimated all-in cost (quoted price + taxes + registration + known charges):</p><ul>' + rs.map(function (r) {

      return { html: '<ul>' + rs.map(function (r) {
        var weak = Object.keys(r.cr).filter(function (k) { return r.cr[k].s != null && r.cr[k].s < 0.5; }).map(function (k) { return DR.CRITERIA[k].toLowerCase() + ' (' + r.cr[k].detail + ')'; });
        var unk = r.unknown.map(function (k) { return DR.CRITERIA[k].toLowerCase(); });

    }

  };

        '<div class="field"><span class="lbl">Horizon</span>' + ch('horizon', [[3, '3 yrs'], [5, '5 yrs'], [10, '10+ yrs']]) + '</div>' +
        '<button class="btn primary block" style="margin-top:1.5rem" data-a="saveInv">Update my results</button>');
      profileSheet.inv = { goal: p.goal, status: p.status, horizon: p.horizon };
      return;
    }
    sheet('Your requirements', '<div class="field" style="margin-top:0"><label class="lbl" for="pb">Maximum budget (₹ lakh), a hard limit</label><input id="pb" class="input mono" inputmode="numeric" value="' + p.budgetMax + '"></div>' +
      '<div class="field"><span class="lbl">BHK, a hard limit</span><div class="chips">' + [1, 2, 3, 4].map(function (b) { return '<button class="chip ' + (p.bhk.indexOf(b) >= 0 ? 'on' : '') + '" data-a="pbhk" data-v="' + b + '">' + b + ' BHK</button>'; }).join('') + '</div></div>' +
      '<div class="field"><label class="lbl" for="pc">Commute limit (minutes at peak)</label><input id="pc" class="input mono" inputmode="numeric" value="' + p.commuteMax + '"><p class="xs muted" style="margin-top:.25rem">' + ic('dashed', 'sm') + ' Assumed during onboarding. Change it if needed.</p></div>' +
      '<div class="field xs muted">Priorities: ' + p.priorities.map(function (k) { return DR.CRITERIA[k]; }).join(' > ') + ' · <button class="link" data-go="#ob-3">Re-rank</button></div>' +
      '<button class="btn primary block" style="margin-top:1.5rem" data-a="saveProfile">Update my results</button>');
    profileSheet.bhk = p.bhk.slice();
  }

  function applyProfile(next) {
    var before = E.run(st.profile), after = E.run(next);
    var bIds = before.focus.map(function (r) { return r.p.id; }), aIds = after.focus.map(function (r) { return r.p.id; });
    var added = aIds.filter(function (i) { return bIds.indexOf(i) < 0; }).length, removed = bIds.filter(function (i) { return aIds.indexOf(i) < 0; }).length;
    st.profile = next; save(); closeSheet(); location.hash = '#home'; render();
    toast('Results updated: ' + (added || removed ? (added ? added + ' added' : '') + (added && removed ? ', ' : '') + (removed ? removed + ' moved out of your focus list' : '') : 'no change to your focus list') + '. ' + after.pass.length + ' homes meet your limits.');
  }

  /* ---------------- Voice (Web Speech API) ---------------- */
  var rec;
  function voice(targetId, btn) {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { toast('Voice input isn\'t supported in this browser. Type instead, or use Chrome.'); return; }
    if (ui.listening && rec) { rec.stop(); return; }
    rec = new SR(); rec.lang = 'en-IN'; rec.interimResults = true; rec.continuous = false;
    var el = document.getElementById(targetId), base = el.value ? el.value + ' ' : '';
    ui.listening = true; btn.classList.add('listening');
    rec.onresult = function (e) { var t = ''; for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; el.value = base + t; };
    rec.onerror = function (e) { toast(e.error === 'not-allowed' ? 'Microphone access was blocked. Type instead.' : 'Didn\'t catch that. Try again or type.'); };
    rec.onend = function () { ui.listening = false; btn.classList.remove('listening'); if (targetId === 'nl') { st.draft.text = el.value; doParse(); } else if (targetId === 'dq') { ui.q = el.value; render(); } else if (targetId === 'aq' && el.value.trim()) { ask(el.value.trim()); } };
    try { rec.start(); } catch (e) { ui.listening = false; btn.classList.remove('listening'); }
  }
  function doParse() {
    var d = st.draft, r = E.parse(d.text); d.parsed = r;
    if (r.prof.budgetMax) d.budgetMax = r.prof.budgetMax;
    if (r.prof.bhk) d.bhk = r.prof.bhk;
    if (r.prof.priorities) d.priorities = r.prof.priorities;
    save(); render();
  }

  /* ---------------- Swipe gestures ---------------- */
  var dragged = false;
  function bindSwipes() {
    document.querySelectorAll('[data-swipe]').forEach(function (w) {
      var card = w.querySelector('.pcard'), x0 = null, dx = 0, id = w.getAttribute('data-swipe');
      card.addEventListener('pointerdown', function (e) { x0 = e.clientX; dx = 0; dragged = false; card.style.transition = 'none'; });
      card.addEventListener('pointermove', function (e) { if (x0 == null) return; dx = e.clientX - x0; if (Math.abs(dx) > 6) { dragged = true; card.style.transform = 'translateX(' + dx + 'px)'; } });
      var end = function () {
        if (x0 == null) return; x0 = null; card.style.transition = 'transform .25s cubic-bezier(.2,.7,.2,1)';
        if (dx > 90) { card.style.transform = 'translateX(110%)'; setTimeout(function () { doSave(id, true); }, 220); }
        else if (dx < -90) { card.style.transform = 'translateX(-110%)'; setTimeout(function () { st.dismissed['card-' + id] = true; save(); render(); toast('Hidden from your focus list.', 'Undo', function () { delete st.dismissed['card-' + id]; save(); render(); }); }, 220); }
        else card.style.transform = '';
      };
      card.addEventListener('pointerup', end); card.addEventListener('pointerleave', end); card.addEventListener('pointercancel', end);
    });
  }
  function doSave(id, fromSwipe) {
    if (!st.profile) { toast('Add your needs to start a shortlist.', 'Personalise', function () { location.hash = '#ob-1'; }); render(); return; }
    if (st.shortlist[id]) { delete st.shortlist[id]; st.cmp = st.cmp.filter(function (x) { return x !== id; }); toast('Removed from shortlist.'); }
    else {
      st.shortlist[id] = 'considering'; st.order.push(id); if (st.cmp.length < 3) st.cmp.push(id);
      logActivity('You saved ' + NM(E.prop(id)) + ' to your shortlist', 'bookmark', '#shortlist');
      var r = E.evaluate(E.prop(id), st.profile), f = r.findings.filter(function (x) { return x.severity === 'high'; })[0];
      toast(f ? 'Saved. The Investigator flagged: ' + f.title.toLowerCase() + '.' : 'Saved to shortlist.', 'View', function () { location.hash = '#shortlist'; });
    }
    save(); render();
  }

  /* ---------------- Actions ---------------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-a],[data-go]'); if (!t) return;
    if (dragged && t.closest('[data-swipe]')) { dragged = false; return; }
    var a = t.getAttribute('data-a'), v = t.getAttribute('data-v'), id = t.getAttribute('data-id');
    if (t.hasAttribute('data-go') && !a) { closeSheet(); location.hash = t.getAttribute('data-go'); return; }
    switch (a) {
      case 'guest': st.seenWelcome = true; st.profile = null; save(); location.hash = '#home'; break;
      case 'intent': st.draft.intent = v; save(); render(); break;
      case 'invLoc': var il = st.draft.inv.localities, ii = il.indexOf(v); st.draft.budgetMax = $('#bud').value; ii >= 0 ? il.splice(ii, 1) : il.push(v); render(); break;
      case 'invType': var it2 = st.draft.inv.types, ij = it2.indexOf(v); st.draft.budgetMax = $('#bud').value; if (ij >= 0) { if (it2.length > 1) it2.splice(ij, 1); else toast('Keep at least one property type.'); } else it2.push(v); render(); break;
      case 'invSet': var kv = v.split(':'), iv2 = st.draft.inv, val = kv[0] === 'horizon' ? +kv[1] : kv[1]; iv2[kv[0]] = iv2[kv[0]] === val ? null : val; render(); break;
      case 'finishInv':
        var di = st.draft, ivv = di.inv, goal = ivv.goal || 'both', assumed = [];
        if (!ivv.goal) assumed.push('Goal: rental and appreciation'); if (!ivv.status) assumed.push('Status: either'); if (!ivv.horizon) assumed.push('Horizon 5 years');
        st.profile = Object.assign({}, DR.DEMO_INVESTOR, { budgetMax: +di.budgetMax, localities: ivv.localities.slice(), types: ivv.types.slice(), goal: goal, status: ivv.status || 'both', horizon: ivv.horizon || 5,
          priorities: { rental: ['yield', 'demand', 'delivery'], appreciation: ['growth', 'delivery', 'yield'], both: ['yield', 'growth', 'delivery'] }[goal], assumed: assumed });
        delete st.profile.name; delete st.profile.email;
        st.seenWelcome = true; save(); location.hash = '#building'; break;
      case 'sample': st.draft.text = '2 or 3 BHK under 85 lakh. We work in Cyber City and Sohna Road, and our kid starts school in 2027, so a good school nearby and a short commute matter. Ideally a good vibe.'; doParse(); break;
      case 'parse': st.draft.text = $('#nl').value; doParse(); break;
      case 'bhk': v = +v; var b = st.draft.bhk, i = b.indexOf(v); i >= 0 ? b.splice(i, 1) : b.push(v); b.sort(); st.draft.text = $('#nl').value; st.draft.budgetMax = $('#bud').value; render(); break;
      case 'ob2': if (st.draft.intent === 'invest') { st.draft.budgetMax = $('#bud').value; if (!+st.draft.budgetMax) { toast('A budget is needed to check which homes qualify.'); render(); break; } save(); location.hash = '#ob-3'; break; }
        var d = st.draft; d.text = $('#nl').value; d.budgetMax = $('#bud').value; if (!+d.budgetMax || !d.bhk.length) { toast('Budget and BHK are needed to check which homes qualify.'); render(); break; } save(); location.hash = '#ob-3'; break;
      case 'prio': var pr = st.draft.priorities, j = pr.indexOf(v); if (j >= 0) pr.splice(j, 1); else if (pr.length < 3) pr.push(v); else toast('Up to 3. Tap one to remove it first.'); render(); break;
      case 'finish':
        var dd = st.draft;
        st.profile = Object.assign({}, DR.DEMO_PROFILE, { budgetMax: +dd.budgetMax, bhk: dd.bhk, priorities: dd.priorities, places: (dd.parsed && dd.parsed.prof.places && dd.parsed.prof.places.length === 2) ? dd.parsed.prof.places : DR.DEMO_PROFILE.places });
        st.seenWelcome = true; save(); location.hash = '#building'; break;
      case 'demo': sheet('Demo controls', '<p class="small muted">For walkthroughs. These simulate time passing and edge cases.</p><div style="display:grid;gap:.5rem;margin-top:1rem"><button class="btn primary block" data-a="loadDemo">Load demo couple (₹85 L, 2–3 BHK)</button><button class="btn ghost block" data-a="loadInvestor">Load demo investor (₹85 L, rental income)</button><button class="btn ghost block" data-a="skip">' + ic('forward', 'sm') + ' Jump 3 weeks ahead (Agent 3)</button><button class="btn ghost block" data-a="tight">Set budget to ₹60 L (no-match state)</button><button class="btn ghost block" data-a="guest">Continue as guest</button><button class="btn ghost block" data-a="reset">' + ic('reset', 'sm') + ' Reset demo</button></div>'); break;
      case 'switchLive': st.draft = { intent: 'live', text: '', parsed: null, budgetMax: st.profile.budgetMax, bhk: [], types: ['Apartment', 'Villa'], priorities: [] }; save(); location.hash = '#ob-2'; break;
      case 'loadInvestor': st.draft = null; st.profile = JSON.parse(JSON.stringify(DR.DEMO_INVESTOR)); st.account = null; st.seenWelcome = true; save(); closeSheet(); location.hash = '#home'; render(); toast('Demo investor loaded: Rohan, rental income.'); break;
      case 'pinv': var pk = v.split(':'), pv = pk[0] === 'horizon' ? +pk[1] : pk[1]; profileSheet.inv[pk[0]] = pv; t.parentNode.querySelectorAll('.chip').forEach(function (c) { c.classList.toggle('on', c === t); }); break;
      case 'saveInv': var ib = +$('#pb').value; if (!ib) { toast('A budget is required.'); break; } var g2 = profileSheet.inv.goal; applyProfile(Object.assign({}, st.profile, profileSheet.inv, { budgetMax: ib, priorities: { rental: ['yield', 'demand', 'delivery'], appreciation: ['growth', 'delivery', 'yield'], both: ['yield', 'growth', 'delivery'] }[g2] })); break;
      case 'loadDemo': st.account = null; st.draft = null; st.profile = JSON.parse(JSON.stringify(DR.DEMO_PROFILE)); st.seenWelcome = true; save(); closeSheet(); location.hash = '#home'; render(); toast('Demo profile loaded: Priya & Arjun.'); break;
      case 'skip': if (!st.profile) { st.profile = JSON.parse(JSON.stringify(DR.DEMO_PROFILE)); st.seenWelcome = true; } if (!st.skip) { st.skip = true; save(); closeSheet(); location.hash = '#home'; render(); toast('3 weeks later. The Future Development Analyst found 1 update near your homes.', 'View', function () { location.hash = '#insights'; }); } else { closeSheet(); toast('Already moved ahead.'); } break;
      case 'tight': if (!st.profile) st.profile = JSON.parse(JSON.stringify(DR.DEMO_PROFILE)); st.seenWelcome = true; closeSheet(); applyProfile(Object.assign({}, st.profile, { budgetMax: 60 })); break;
      case 'reset': try { localStorage.removeItem(KEY); } catch (x) {} st = fresh(); ui.tab = 'summary'; closeSheet(); applyTheme(); location.hash = '#welcome'; render(); break;
      case 'close': closeSheet(); break;
      case 'back': var to = t.getAttribute('data-to'); if (to) location.hash = to; else if (history.length > 1) window.history.back(); else location.hash = '#home'; break;
      case 'editProfile': profileSheet(); break;
      case 'pbhk': v = +v; var pb = profileSheet.bhk, k = pb.indexOf(v); k >= 0 ? pb.splice(k, 1) : pb.push(v); pb.sort(); t.classList.toggle('on'); break;
      case 'saveProfile': var nb = +$('#pb').value, nc = +$('#pc').value; if (!nb || !profileSheet.bhk.length) { toast('Budget and at least one BHK are required.'); break; } applyProfile(Object.assign({}, st.profile, { budgetMax: nb, bhk: profileSheet.bhk, commuteMax: nc || 45 })); break;
      case 'relax': var rx = E.relaxations(st.profile).options[+t.getAttribute('data-i')]; applyProfile(Object.assign({}, st.profile, rx.patch)); break;
      case 'askFocus': advisorSheet(null, E.run(st.profile).focus.map(function (r) { return r.p.id; })); ask(t.getAttribute('data-q')); break;
      case 'editAccount': var ac = acct(); sheet('Edit profile', '<div class="field" style="margin-top:0"><label class="lbl" for="an">Name</label><input id="an" class="input" value="' + esc(ac.name) + '"></div><div class="field"><label class="lbl" for="ae">Email</label><input id="ae" class="input" type="email" value="' + esc(ac.email) + '"><p class="xs muted" style="margin-top:.25rem">Stored on this device only. No email is sent in this prototype.</p></div><button class="btn primary block" style="margin-top:1.5rem" data-a="saveAccount">Save</button>'); break;
      case 'saveAccount': var an = $('#an').value.trim(), ae = $('#ae').value.trim(); if (!an) { toast('Enter a name.'); break; } if (ae && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(ae)) { toast('That email doesn\'t look right. Check it and try again.'); break; } st.account = { name: an, email: ae }; save(); closeSheet(); render(); toast('Profile saved.'); break;
      case 'theme': st.theme = v; save(); applyTheme(); render(); break;
      case 'npref': var np2 = nprefs(); np2[v] = !np2[v]; st.nprefs = np2; save(); render(); break;
      case 'ptype': var ty = st.profile.types.slice(), ti = ty.indexOf(v); if (ti >= 0) { if (ty.length === 1) { toast('Keep at least one property type.'); break; } ty.splice(ti, 1); } else ty.push(v); st.profile = Object.assign({}, st.profile, { types: ty }); save(); render(); toast('Updated. ' + E.run(st.profile).pass.length + ' homes now meet your limits.'); break;
      case 'faq': ui.faq = ui.faq === +v ? null : +v; render(); break;
      case 'copyEmail': (navigator.clipboard ? navigator.clipboard.writeText('support@example.com') : Promise.reject()).then(function () { toast('Email address copied.'); }, function () { toast('Copy isn\'t available here. Select the address instead.'); }); break;
      case 'copyData': var dump = JSON.stringify({ account: acct(), profile: st.profile, shortlist: st.shortlist, theme: st.theme || 'light', notifications: nprefs() }, null, 2); (navigator.clipboard ? navigator.clipboard.writeText(dump) : Promise.reject()).then(function () { toast('Your data was copied as JSON.'); }, function () { sheet('Your data', '<pre class="mono" style="white-space:pre-wrap;user-select:all;font-size:.75rem">' + esc(dump) + '</pre>'); }); break;
      case 'clearChat': st.chat = []; save(); render(); toast('Advisor chat cleared.'); break;
      case 'askDelete': sheet('Delete all data?', '<p class="small">This removes your profile, shortlist, notes and settings from this device. It can\'t be undone.</p><div style="display:grid;gap:.5rem;margin-top:1.25rem"><button class="btn block" style="background:var(--danger);color:#FFFFFF" data-a="reset">Delete everything</button><button class="btn ghost block" data-a="close">Cancel</button></div>'); break;
      case 'askLogout': sheet('Log out?', '<p class="small">There are no server accounts in this prototype, so logging out clears your profile, shortlist and settings from this device.</p><div style="display:grid;gap:.5rem;margin-top:1.25rem"><button class="btn primary block" data-a="reset">Log out</button><button class="btn ghost block" data-a="close">Cancel</button></div>'); break;
      case 'confirmAssumed': st.assumedOk = true; save(); render(); toast('Thanks. Your assumed settings are now confirmed.'); break;
      case 'poi': ui.poi = ui.poi === v ? null : v; render(); break;
      case 'mapf': ui.mapf = v; ui.poi = null; render(); break;
      case 'view': ui.view = v; render(); break;
      case 'unhide': Object.keys(st.dismissed).forEach(function (x) { if (x.indexOf('card-') === 0) delete st.dismissed[x]; }); save(); render(); break;
      case 'openNotif':
        var nn = notifs().find(function (x) { return x.id === id; }); if (!nn) break; st.read[id] = true; save(); closeSheet();
        if (nn.insight) { ui.focusIns = nn.insight; if (location.hash === '#insights') render(); else location.hash = '#insights'; }
        else if (nn.go) location.hash = nn.go; break;
      case 'dismissN': st.read[id] = true; st.dismissed[id] = true; save(); render(); toast('Notification dismissed.', 'Undo', function () { delete st.dismissed[id]; save(); render(); }); break;
      case 'readAll': notifs().forEach(function (x) { st.read[x.id] = true; }); save(); render(); break;
      case 'openEvidence': var fld = t.getAttribute('data-f'); ui.tab = 'evidence'; location.hash = '#p-' + id + '-evidence'; if (fld) setTimeout(function () { claimSheet(id, fld); }, 260); break;
      case 'go2': if (v.indexOf('#ins-') === 0) { ui.focusIns = v.slice(1); render(); } else location.hash = v; break;
      case 'openInsight':
        var it = insights().concat([]).find(function (x) { return x.id === id; }); if (!it) break; st.read[id] = true; save();
        ui.tab = it.cat === 'infra' ? 'future' : 'evidence'; location.hash = '#p-' + it.pid + '-' + ui.tab;
        if (it.field) setTimeout(function () { claimSheet(it.pid, it.field); }, 260); break;
      case 'dismiss': st.dismissed[id] = true; save(); render(); toast('Dismissed.', 'Undo', function () { delete st.dismissed[id]; save(); render(); }); break;
      case 'ins': ui.ins = v; render(); break;
      case 'tab': ui.tab = v; window.history.replaceState(null, '', '#p-' + id + '-' + v); render(); break;
      case 'brk': ui.showBreak = !ui.showBreak; render(); break;
      case 'claim': claimSheet(id, t.getAttribute('data-f')); break;
      case 'copyQ': var qs = [].slice.call(document.querySelectorAll('.qlist li')).map(function (li) { return li.textContent; }).map(function (q, n) { return (n + 1) + '. ' + q; }).join('\n'); (navigator.clipboard ? navigator.clipboard.writeText(qs) : Promise.reject()).then(function () { toast('Questions copied. Paste them into WhatsApp or email to the builder.'); }, function () { toast('Copy isn\'t available here. Select the text instead.'); }); break;
      case 'save': doSave(id); break;
      case 'advisor': advisorSheet(id); break;
      case 'ask': ask(t.getAttribute('data-q')); break;
      case 'askInput': var q = $('#aq').value.trim(); if (q) { $('#aq').value = ''; ask(q); } break;
      case 'voice': voice(t.getAttribute('data-t'), t); break;
      case 'qf': if (!location.hash.match(/discover/)) { ui.qf = {}; ui.qf[v] = true; location.hash = '#discover'; } else { ui.qf[v] = !ui.qf[v]; render(); } break;
      case 'sort': ui.sort = v; render(); break;
      case 'clearq': ui.q = ''; ui.qf = {}; ui.fl = ''; ui.fb = ''; render(); break;
      case 'gsearch': ui.q = $('#gq').value; location.hash = '#discover'; break;
      case 'cmp': var ci = st.cmp.indexOf(v); if (ci >= 0) st.cmp.splice(ci, 1); else if (st.cmp.length < 3) st.cmp.push(v); else toast('Compare up to 3 homes.'); save(); render(); break;
      case 'slst': st.shortlist[id] = v; logActivity(NM(E.prop(id)) + ' marked as ' + SL[v].toLowerCase(), v === 'walked' ? 'logout' : 'check', '#shortlist'); save(); render(); if (v === 'walked') toast('Marked as walked away. That\'s a decision too.'); break;
    }
  });
  document.addEventListener('change', function (e) { var f = e.target.getAttribute && e.target.getAttribute('data-f'); if (f) { ui[f] = e.target.value; render(); } });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'dq') { ui.q = e.target.value; render(); }
    if (e.key === 'Enter' && e.target.id === 'gq') { ui.q = e.target.value; location.hash = '#discover'; }
    if (e.key === 'Enter' && e.target.id === 'aq') { var q = e.target.value.trim(); if (q) { e.target.value = ''; ask(q); } }
    if (e.key === 'Escape') closeSheet();
    if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('pcard')) e.target.click();
  });

  /* compare from Advisor chips on compare screen: use cmp ids */
  var _ask = ask;
  ask = function (q) { if (!$('#shb')) { advisorSheet(); advisorSheet.ids = st.cmp.length >= 2 ? st.cmp.slice() : advisorSheet.ids; } _ask(q); };

  /* Appearance: light (default), dark, or follow the device */
  function applyTheme() {
    var m = st.theme || 'light', mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    document.documentElement.setAttribute('data-theme', m === 'dark' || (m === 'system' && mq && mq.matches) ? 'dark' : 'light');
  }
  if (window.matchMedia) { var mql = window.matchMedia('(prefers-color-scheme: dark)'); var onMq = function () { if ((st.theme || 'light') === 'system') applyTheme(); }; mql.addEventListener ? mql.addEventListener('change', onMq) : mql.addListener && mql.addListener(onMq); }
  applyTheme();
  render();
})();

</script>
